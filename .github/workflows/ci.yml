name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bundle:check
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - name: Build production analytics fixture
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-e2e-production
          NEXT_PUBLIC_SUPABASE_URL: https://schedule-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-public-key
      - name: Check production analytics and role boundary
        run: npx playwright test --config=playwright.analytics-production.config.ts --workers=1
      - name: Build production asset delivery fixture
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-assets-check
          VERCEL_ENV: production
          REDPARTY_ASSET_ALIAS_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: https://schedule-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-key
      - name: Check cross-origin assets and auth return address
        run: npx playwright test --config=playwright.assets-production.config.ts --workers=1
        env:
          REDPARTY_ASSET_ALIAS_ENABLED: "true"
      - name: Build production with asset alias disabled
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-assets-check-off
          VERCEL_ENV: production
          REDPARTY_ASSET_ALIAS_ENABLED: "false"
          NEXT_PUBLIC_SUPABASE_URL: https://schedule-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-key
      - name: Check same-origin assets and auth return address
        run: npx playwright test --config=playwright.assets-production.config.ts --workers=1
        env:
          REDPARTY_ASSET_ALIAS_ENABLED: "false"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  external-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/external-api
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno task check
      - run: deno task lint
      - run: deno task fmt:check
      - run: deno task test
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Check Google Sheets cursor and calendar client
        run: node --test ../../../examples/google-sheets/client.test.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start local database
        run: supabase db start
      - name: Rebuild schema from migrations
        run: supabase db reset
      - name: Check database security contracts
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/security_contracts.sql
      - name: Check Dashboard role access
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/dashboard_access.sql
      - name: Check schedule filter limit RPC
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/schedule_filter_limits.sql
      - name: Check club palette and administrator permissions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/limit_palette.sql
      - name: Check closed slot appearance and permissions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/locked_slot_appearance.sql
      - name: Check hourly load isolation and permissions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/hour_load.sql
      - name: Check player schedule limit contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/player_schedule_limits.sql
      - name: Check atomic schedule edit contract
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/atomic_schedule_edit.sql
      - name: Check ordinary player act-as access and restrictions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/schedule_act_as.sql
      - name: Check compact reads and private change notifications
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/compact_schedule.sql
      - name: Check event-driven revisions, Presence isolation and conditional writes
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/event_driven_schedule.sql
      - name: Check concurrent v2 and legacy edits
        run: python3 supabase/tests/event_driven_concurrency.py
      - name: Check member table preset RPC
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/member_table_presets.sql
      - name: Check current distance ID assignments
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/member_distance_links.sql
      - name: Check clearing and restoring an existing distance entry
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/distance_zero_update.sql
      - name: Check current distance filter metadata
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/distance_filter_metadata.sql
      - name: Check live priorities and request privacy
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/live_priorities.sql
      - name: Check saved priority matrix
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/priority_matrix.sql
      - name: Check active rating selection and permissions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/active_priority.sql
      - name: Check Nitro and Regular capacity isolation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/capacity.sql
      - name: Check compact monthly roster and conditional reads
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/month_roster.sql
      - name: Check member presence access and activity summary
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/member_online.sql
      - name: Lint database
        run: supabase db lint --local --schema public,external_api_private,schedule_private --level warning
      - name: Check external API keys, filters, completeness and quotas
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/external_api.sql
      - name: Check immutable API snapshot pagination
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/external_api_pagination.sql
      - name: Check API v2 cursor isolation, cell deltas and metadata
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/external_api_sync.sql
      - name: Check external API calculated priority order
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/external_api_priority.sql
      - name: Check root log filters, permissions and cleanup
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/root_logs.sql
      - name: Check root API client administration
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/external_api_root_admin.sql
      - name: Check API v2 concurrent commits
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c 'begin' -f supabase/tests/fixtures/external_api_seed.sql -c 'commit'
          python3 supabase/tests/external_api_sync_concurrency.py
      - name: Stop local database
        if: ${{ always() }}
        run: supabase stop --no-backup

  schedule-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - name: Start disposable Auth, API and Realtime
        run: |
          supabase start -x storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta,mailpit
          supabase status -o json > "$RUNNER_TEMP/schedule-sync-status.json"
      - name: Check complete month and loading recovery
        run: node node_modules/@playwright/test/cli.js test --config=playwright.live.config.ts --workers=1
        working-directory: apps/web
      - name: Check two real sessions and reconnect
        run: node node_modules/@playwright/test/cli.js test --config=playwright.sync.config.ts --workers=1
        working-directory: apps/web
        env:
          SCHEDULE_SYNC_STATUS: ${{ runner.temp }}/schedule-sync-status.json
          SCHEDULE_SYNC_DB_CONTAINER: supabase_db_schedule-app
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: schedule-sync-results
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Stop disposable stack
        if: ${{ always() }}
        run: supabase stop --no-backup

  external-api-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Start disposable Supabase with real Edge runtime
        run: |
          supabase start -x storage-api,imgproxy,logflare,vector,supavisor,studio,postgres-meta,mailpit
          supabase db reset
      - name: Prepare isolated HTTP fixture keys
        run: |
          python3 supabase/functions/external-api/tools/prepare-local-tests.py --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres --env-file "$RUNNER_TEMP/api-integration.env"
      - name: Serve and test both API versions over the actual gateway
        working-directory: supabase/functions/external-api
        run: |
          set -a
          source "$RUNNER_TEMP/api-integration.env"
          set +a
          supabase functions serve external-api > "$RUNNER_TEMP/external-api-serve.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $EXTERNAL_API_TEST_KEY" 'http://127.0.0.1:54321/functions/v1/external-api/v1/schedule?date=2097-01-01&days=1' || true)
            if [ "$code" = 200 ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/external-api-serve.log"; exit 1; fi
          deno task test:integration
      - name: Stop disposable API stack
        if: ${{ always() }}
        run: supabase stop --no-backup
