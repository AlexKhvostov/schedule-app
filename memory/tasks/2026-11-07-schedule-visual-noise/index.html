<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание — сравнение двух вариантов</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #10151d; color: #edf2f7; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1280px; margin: auto; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p { margin: 0 0 18px; color: #afbdcc; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 16px; }
  .versions { display: flex; gap: 6px; }
  button, select { min-height: 42px; padding: 8px 14px; border: 1px solid #526174; border-radius: 7px; background: #1d2734; color: inherit; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #caeceb; color: #153c3a; border-color: #caeceb; }
  button:focus-visible, select:focus-visible { outline: 3px solid #7bded9; outline-offset: 3px; }
  label { display: flex; align-items: center; gap: 8px; }
  figure { margin: 0; }
  #stage { position: relative; width: 100%; aspect-ratio: 1280/900; background: #17212c; }
  #stage.mobile { width: min(100%,390px); aspect-ratio: 390/844; margin-inline: auto; }
  img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
  img[hidden] { display: none; }
  figcaption { margin: 12px 0; color: #afbdcc; }
  @media(max-width:600px) { body { padding: 12px; } h1 { font-size: 20px; } }
</style>
<main>
  <h1>Те же размеры. Меньше визуального шума.</h1>
  <p>Переключайте варианты: день и метки останутся на тех же местах. Это снимки на одинаковых тестовых данных.</p>
  <div class="controls">
    <div class="versions" role="group" aria-label="Вариант оформления">
      <button type="button" data-version="before" aria-pressed="false">A · До</button>
      <button type="button" data-version="after" aria-pressed="true">B · После</button>
    </div>
    <label>Экран <select id="view"><option value="desktop">Компьютер</option><option value="mobile">Телефон: обзор</option><option value="editing">Телефон: редактирование</option></select></label>
    <label>Тема <select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
  </div>
  <figure>
    <div id="stage">
      <img id="before" alt="Вариант A: повторные подписи и более яркие контуры" hidden width="1280" height="900">
      <img id="after" alt="Вариант B: общая плашка лимита с названием по центру, спокойные линии" width="1280" height="900">
    </div>
    <figcaption id="caption" aria-live="polite"></figcaption>
  </figure>
</main>
<script>
  const view = document.querySelector('#view');
  const theme = document.querySelector('#theme');
  const stage = document.querySelector('#stage');
  const caption = document.querySelector('#caption');
  const buttons = [...document.querySelectorAll('[data-version]')];
  let version = 'after';
  function update() {
    stage.classList.toggle('mobile', view.value !== 'desktop');
    for (const name of ['before', 'after']) {
      const image = document.getElementById(name);
      image.src = `${name}-${view.value}-${theme.value}.png`;
      image.hidden = name !== version;
    }
    for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.version === version));
    caption.textContent = version === 'before'
      ? 'A · Сохранённый компактный вариант. Отдельные плашки и повторяющиеся подписи строк.'
      : 'B · Общая плашка на всю группу, N50 или N100 по центру вертикали. Пустые клетки и разделители спокойнее. Размеры и интервалы прежние.';
  }
  for (const button of buttons) button.addEventListener('click', () => { version = button.dataset.version; update(); });
  view.addEventListener('change', update);
  theme.addEventListener('change', update);
  update();
</script>
</html>
