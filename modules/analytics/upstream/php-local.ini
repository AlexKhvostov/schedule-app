; Only for the project-local Windows PHP selected by api/serve.js.
; Do not upload this file as a replacement for the hosting provider's php.ini.
extension=pdo_mysql
extension=mbstring
date.timezone=UTC
memory_limit=512M
post_max_size=8M
upload_max_filesize=2M
session.upload_progress.enabled=0
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL
